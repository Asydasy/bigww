# Uruchomienie całości: docker compose up
#
# Nic więcej nie trzeba — kontener sam zakłada tabele (migrate), wgrywa katalog
# gier (seed) i startuje serwer razem z plikami frontu. Potem wchodzisz na
# http://localhost:3000
#
# Własne ustawienia (JWT_SECRET, Discord) wpisujesz w server/.env — serwer
# czyta ten plik sam, a wartości podane niżej mają pierwszeństwo tylko tam,
# gdzie Docker musi (adres bazy) albo gdzie chcemy działania "od ręki".

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bigww
      POSTGRES_PASSWORD: bigww
      POSTGRES_DB: bigww
    ports:
      - "5432:5432"
    volumes:
      - bigww_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigww"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "npm install && npm run migrate && npm run seed && npm run start"
    environment:
      # W sieci Dockera baza nazywa się "db", nie "localhost".
      DATABASE_URL: postgresql://bigww:bigww@db:5432/bigww
      # Front i API pod jednym adresem — bez kłopotów z CORS-em.
      SERVE_STATIC: "${SERVE_STATIC:-1}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
      FRONT_URL: "${FRONT_URL:-http://localhost:3000/index.html}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000}"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bigww_node_modules:/app/server/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  bigww_pgdata:
  bigww_node_modules:
